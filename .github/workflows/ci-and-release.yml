name: RustIDM v1.1.0 CI & Multi-Platform Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-test:
    name: Verify Engine, HLS AES-128, URL Refresh & Native Host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2

      - name: Run Unit & Integration Tests
        run: cargo test --release -- --nocapture

      - name: Run Independent Self-Verification Suite (CLI verify)
        run: cargo run --release -- verify

  build-binaries:
    name: Build (${{ matrix.os }})
    needs: verify-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_path: target/x86_64-pc-windows-msvc/release/rust_idm.exe
            artifact_name: rust_idm-windows-x86_64.exe
            feature_args: --features desktop-tauri
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_path: target/x86_64-unknown-linux-gnu/release/rust_idm
            artifact_name: rust_idm-linux-x86_64
            feature_args: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_path: target/aarch64-apple-darwin/release/rust_idm
            artifact_name: rust_idm-macos-arm64
            feature_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain for Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.feature_args }}

      - name: Prepare Platform Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  package-chrome-extension:
    name: Package Chrome Extension (Manifest V3 + Native Messaging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate manifest.json Syntax
        run: python3 -m json.tool chrome-extension/manifest.json > /dev/null

      - name: Zip Chrome Extension
        run: |
          cd chrome-extension
          zip -r ../rust_idm_chrome_extension_mv3.zip manifest.json background.js content.js

      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_idm_chrome_extension_mv3
          path: rust_idm_chrome_extension_mv3.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, package-chrome-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          generate_release_notes: true