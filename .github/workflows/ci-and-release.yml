name: StormGet v2.3.5 — Windows Only CI & Installer Builder (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-exe-and-installer:
    name: Verify, Test & Build Windows x64 (.exe + Setup Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Registry & Target Build
        uses: Swatinem/rust-cache@v2

      - name: Run Unit & Security Tests (70 Tests)
        shell: pwsh
        run: cargo test --release -- --nocapture

      - name: Run Independent 12-Stage Self-Verification Suite
        shell: pwsh
        run: cargo run --release -- verify

      - name: Build Windows x64 egui Desktop Edition (StormGet-v2.3.5-windows-x86_64-egui.exe)
        shell: pwsh
        run: |
          cargo build --release --features native-ui
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\rust_idm.exe" "dist\StormGet-v2.3.5-windows-x86_64-egui.exe" -Force

      - name: Build Windows x64 Slint Arabic RTL Edition (StormGet-v2.3.5-windows-x86_64-slint.exe)
        shell: pwsh
        run: |
          cargo build --release --features slint-ui
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\rust_idm.exe" "dist\StormGet-v2.3.5-windows-x86_64-slint.exe" -Force
          Copy-Item "target\release\rust_idm.exe" "dist\StormGet-Setup.exe" -Force

      - name: Build Official Windows Setup Installer via Inno Setup (StormGet-v2.3.5-Setup-x64.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer\StormGet-Setup.iss"
            if (Test-Path "dist\StormGet-v2.3.5-Setup-x64.exe") {
              Copy-Item "dist\StormGet-v2.3.5-Setup-x64.exe" "dist\StormGet-Setup.exe" -Force
            }
          }

      - name: Package Browser Extension (Chrome / Edge / Brave / Firefox)
        shell: pwsh
        run: |
          Compress-Archive -Path "chrome-extension\*" -DestinationPath "dist\StormGet-v2.3.5-browser-extension.zip" -Force

      - name: Generate SHA256SUMS for Windows Release Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "dist\SHA256SUMS" -Encoding UTF8
          Copy-Item "dist\SHA256SUMS" "dist\SHA2-256SUMS" -Force
          Get-Content "dist\SHA256SUMS"

      - name: Upload Windows .exe & Setup Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StormGet-v2.3.5-Windows-x64-Package
          path: dist/*

      - name: Publish GitHub Release (on Tag Push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
