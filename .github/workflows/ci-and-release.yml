      - name: Build Official Windows Setup Installer via Inno Setup (StormGet-v2.3.5-Setup-x64.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer\StormGet-Setup.iss"
            if (Test-Path "dist\StormGet-v2.3.5-Setup-x64.exe") {
              Copy-Item "dist\StormGet-v2.3.5-Setup-x64.exe" "dist\StormGet-Setup.exe" -Force
            }
          }

      - name: Package Browser Extension (Chrome / Edge / Brave / Firefox)
        shell: pwsh
        run: |
          Compress-Archive -Path "chrome-extension\*" -DestinationPath "dist\StormGet-v2.3.5-browser-extension.zip" -Force

      - name: Generate SHA256SUMS for Windows Release Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "dist\SHA256SUMS" -Encoding UTF8
          Copy-Item "dist\SHA256SUMS" "dist\SHA2-256SUMS" -Force
          Get-Content "dist\SHA256SUMS"

      - name: Upload Windows .exe & Setup Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StormGet-v2.3.5-Windows-x64-Package
          path: dist/*

      - name: Publish GitHub Release (on Tag Push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
