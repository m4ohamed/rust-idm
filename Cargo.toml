[package]
name = "rust_idm"
version = "2.3.4"
edition = "2021"
authors = ["RustIDM Engineering"]
description = "StormGet (formerly RustIDM) v2.3.4 — Production Desktop Download Manager in Rust with Slint native Arabic RTL UI & egui desktop UI, NTFS Sparse + Positional I/O, YouTube 10MB Range Chunking & Direct Stream Capture (yt-core), Auto yt-dlp/ffmpeg Installer & Updater, Hardened Local IPC Security, HLS AES-128, MPEG-DASH, Remote ZIP Inspector, and SHA-256/MD5/CRC32 verification"
license = "MIT"
build = "build.rs"

[features]
default = []
native-ui = ["dep:eframe", "dep:tray-icon", "reqwest/blocking"]
slint-ui = ["dep:slint", "dep:slint-build", "dep:tray-icon"]

[dependencies]
# محرك البرمجة غير المتزامنة (Async Runtime)
tokio = { version = "1.40", features = ["full"] }

# عميل الشبكة وبروتوكول HTTP/HTTPS مع rustls-tls للبناء العابر للأنظمة دون مشاكل OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "cookies", "rustls-tls", "gzip", "brotli"] }

# خادم الاتصال المحلي (Local IPC Server)
axum = { version = "0.7", features = ["macros", "json"] }
tower-http = { version = "0.5", features = ["cors"] }

# تسلسل البيانات وحفظ حالة استئناف التحميل الذري (Atomic State Persistence & Native Messaging JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# أدوات التدفق غير المتزامن (Async Streams)
futures-util = "0.3"

# التشفير وفك التشفير القياسي لبث HLS AES-128-CBC والبصمة الرقمية SHA-256 (RustCrypto)
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
ring = "0.17"

# تحليل معاملات سطر الأوامر وأشرطة التقدم (CLI & Progress Bars)
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

# إدارة الوقت والجدولة والمعرفات الفريدة وتحليل الروابط (Scheduling, UUIDs, URLs & Regex)
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
url = "2.5"
regex = "1.10"
anyhow = "1.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
slint = { version = "1.8", optional = true }

[build-dependencies]
slint-build = { version = "1.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = { version = "0.26.1", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
